<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Cadastro de usuário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Cadastrar usuário</h1>

    <form action="">

        <h2>
            <span>1</span> Dados pessoais
        </h2>

        <label for="nome">Nome:</label>
        <input type="text" id="nome">

        <label for="email">Email:</label>
        <input type="Email" id="email">

        <label for="senha">Senha</label>
        <input type="password" id="senha">

        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha">

        <label>Idade:</label>

        <label for="acima17"> 
            <input type="radio" name="idade" id="acima17"> Acima 17
        </label>

        <label for="abaixo17">
            <input type="radio" name="idade" id="abaixo17"> Abaixo ou igual 17
        </label>

        <h2>
            <span>2</span> Perfil
        </h2>

        <label for="descricao">Descrição:</label>
        <textarea name="descricao" id="descricao"></textarea>
    
        <label for="perfil">Perfil Trabalho</label>
        <select name="perfil" id="perfil">

            <option value="frontend">Front-End Developer</option>

            <option value="backend">Back-End Developer</option>
            
            <option value="fullstack">Full-Stack Developer</option>
        </select>

        <label>Interesses</label>
        <label>
            <input type="checkbox">
            Programador
        </label>

        <label>
            <input type="checkbox">
            Design
        </label>

        <label>
            <input type="checkbox">
            Analista
        </label>

        <button type="submit">Enviar dados</button>

    </form>

</body>
</html>
